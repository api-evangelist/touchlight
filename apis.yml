aid: touchlight
name: Touchlight
description: >-
  Touchlight is a UK-based cell-free DNA manufacturer, founded in 2007 and headquartered in
  Hampton, London, that produces synthetic DNA enzymatically rather than by bacterial
  fermentation. Its doggybone DNA (dbDNA) platform — along with mbDNA and z-dbDNA — is a
  cell-free, plasmid-free DNA vector used as starting material for mRNA, viral vector (AAV,
  lentivirus), non-viral gene therapy, gene editing and DNA vaccine programs, manufactured at
  what the company describes as the first GMP-licensed facility for fully cell-free enzymatic
  DNA. Touchlight sells physical DNA material — off-the-shelf catalogue constructs and custom
  RUO-to-GMP manufacturing — and operates no developer program, public API, or machine-readable
  API contract of any kind.
